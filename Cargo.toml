[workspace]
members = [
  "apps/dataset-cli",
  "apps/normalize-cli",
  "apps/replay-cli",
  "apps/wal-cli",
  "crates/collector-core",
  "crates/event-contracts",
  "crates/dataset-core",
  "crates/normalizer-core",
  "crates/replay-core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/clt123321/event-contract-lab"
rust-version = "1.88"

[workspace.dependencies]
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
fs2 = "0.4"
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
